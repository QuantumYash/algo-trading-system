[project]
name = "algo-trading-system"
version = "0.1.0"
description = "Algorithmic trading system with live grid and stop-and-reverse execution engines"
authors = [
    {name = "Yash Malik"}
]
license = "MIT"
requires-python = ">=3.12,<4.0"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "websockets (>=17.1,<18.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "duckdb (>=1.5.5,<2.0.0)"
]


[tool.poetry]
packages = [
    { include = "trading_system", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)"
]
